<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-labelledby="title description">
  <title id="title">Expense Tracker request flow</title>
  <desc id="description">A browser requests the web app from Nginx. Nginx serves the frontend and forwards API requests to the Node.js and Express service, which reads and writes expense data in MySQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#62748a"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .label { font-size: 15px; font-weight: 700; }
      .detail { font-size: 13px; fill: #52657d; }
      .flow { stroke: #62748a; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="400" rx="24" fill="#f4f7fb"/>
  <text x="56" y="62" font-size="25" font-weight="700">A request moves through four simple stops</text>
  <text x="56" y="91" font-size="15" fill="#52657d">The web tier serves the page and passes API traffic to the data tier.</text>

  <rect x="55" y="145" width="205" height="150" rx="18" fill="#ffffff" stroke="#c8d4e2" stroke-width="2"/>
  <circle cx="157" cy="190" r="22" fill="#e2efff"/>
  <path d="M145 190h24M157 178v24" stroke="#3478c8" stroke-width="3" stroke-linecap="round"/>
  <text class="label" x="157" y="238" text-anchor="middle">Browser</text>
  <text class="detail" x="157" y="262" text-anchor="middle">Expense web page</text>

  <path class="flow" d="M270 220h48"/>
  <text class="detail" x="294" y="204" text-anchor="middle">HTTP</text>

  <rect x="330" y="145" width="205" height="150" rx="18" fill="#e8f4ff" stroke="#91bce4" stroke-width="2"/>
  <circle cx="432" cy="190" r="22" fill="#cfe7ff"/>
  <path d="M420 181h24v18h-24zM424 176h16" fill="none" stroke="#3478c8" stroke-width="3" stroke-linejoin="round"/>
  <text class="label" x="432" y="238" text-anchor="middle">Nginx</text>
  <text class="detail" x="432" y="262" text-anchor="middle">Static files + API proxy</text>

  <path class="flow" d="M545 220h48"/>
  <text class="detail" x="569" y="204" text-anchor="middle">/api</text>

  <rect x="605" y="145" width="220" height="150" rx="18" fill="#eaf7ef" stroke="#9bc9aa" stroke-width="2"/>
  <circle cx="715" cy="190" r="22" fill="#d3efdc"/>
  <path d="M703 181h24v18h-24zM709 176h12M709 187h12M709 193h8" fill="none" stroke="#368353" stroke-width="2.5" stroke-linejoin="round"/>
  <text class="label" x="715" y="238" text-anchor="middle">Node.js + Express</text>
  <text class="detail" x="715" y="262" text-anchor="middle">Expense API on port 8080</text>

  <path class="flow" d="M835 220h48"/>
  <text class="detail" x="859" y="204" text-anchor="middle">SQL</text>

  <rect x="895" y="145" width="170" height="150" rx="18" fill="#fff3df" stroke="#e5c38b" stroke-width="2"/>
  <ellipse cx="980" cy="180" rx="25" ry="9" fill="#ffe4b2" stroke="#ba8431" stroke-width="2"/>
  <path d="M955 180v24c0 5 11 9 25 9s25-4 25-9v-24M955 192c0 5 11 9 25 9s25-4 25-9" fill="none" stroke="#ba8431" stroke-width="2"/>
  <text class="label" x="980" y="238" text-anchor="middle">MySQL</text>
  <text class="detail" x="980" y="262" text-anchor="middle">Expense records</text>
</svg>
